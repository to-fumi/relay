openapi: 3.1.0
info:
  title: Relay API
  version: 0.1.0
  description: 備品の受け渡しを記録し、そのログを分析するための API。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: identity
    description: ログイン中のユーザー
  - name: handoff
    description: 受け渡しの記録

paths:
  /me:
    get:
      operationId: getMe
      summary: ログイン中のユーザーを取得する（初回は自動で登録する）
      tags: [identity]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /handoff-tokens:
    post:
      operationId: issueHandoffToken
      summary: 受け渡し用のQRトークンを発行する（渡す側）
      tags: [handoff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueHandoffTokenRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /handoffs:
    post:
      operationId: receiveHandoff
      summary: QRトークンを読み取り、受け渡しを記録する（受け取る側）
      description: 返却用のQRトークンを渡したときは、type が `urn:relay:problem:return-token` の 400 を返す（返却は /returns で記録する）。
      tags: [handoff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveHandoffRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: トークンは使用済み
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 自分自身には渡せない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /return-tokens:
    post:
      operationId: issueReturnToken
      summary: 返却用のQRトークンを発行する（借りた側）
      description: 返却期限付きで受け取った記録について、返却用のQRトークンを発行する。貸した側がこれを読み取ると返却済みになる。
      tags: [handoff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueReturnTokenRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: すでに返却済み
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /returns:
    post:
      operationId: returnHandoff
      summary: 返却用のQRトークンを読み取り、返却を記録する（貸した側）
      tags: [handoff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnHandoffRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 貸した本人ではない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: すでに返却済み
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /return-requests:
    post:
      operationId: requestReturns
      summary: 対面でないときに、借りたものをまとめて返却の承認待ちにする（借りた側）
      description: |
        貸した人が違うものも一緒に送れる。1 件でも返せないもの（他人の記録、返却の必要がない、返却済み、承認待ち）があれば、どれも記録しない。
        貸した側が /return-confirmations で承認すると返却済みになる。
      tags: [handoff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffIdsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: すでに返却済み、または承認待ちのものがある
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /return-confirmations:
    post:
      operationId: confirmReturns
      summary: 承認待ちの返却をまとめて承認し、返却済みにする（貸した側）
      description: 1 件でも承認できないもの（他人に貸したもの、承認待ちでない、返却済み）があれば、どれも記録しない。
      tags: [handoff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoffIdsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: すでに返却済み、または承認待ちでないものがある
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/outstanding-handoffs:
    get:
      operationId: listMyOutstandingHandoffs
      summary: 返却期限付きでまだ返却されていない記録（貸している・借りている）を、期限が近い順に取得する
      tags: [handoff]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handoff"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/handoffs:
    get:
      operationId: listMyHandoffs
      summary: 自分が渡した・受け取った記録を新しい順に取得する
      tags: [handoff]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handoff"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 入力またはトークンが不正、もしくは期限切れ
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: 認証されていない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 記録が見つからない
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    User:
      type: object
      required: [id, displayName, email, isAdmin]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean

    UserSummary:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    IssueHandoffTokenRequest:
      type: object
      required: [item, qty]
      properties:
        item:
          type: string
          minLength: 1
          maxLength: 200
        qty:
          type: integer
          minimum: 1
        dueDate:
          type: string
          format: date
          description: 返却期限（この日の終わりまで）。省略すると返却の必要がない受け渡しになる

    IssueReturnTokenRequest:
      type: object
      required: [handoffId]
      properties:
        handoffId:
          type: string
          format: uuid

    HandoffIdsRequest:
      type: object
      required: [handoffIds]
      properties:
        handoffIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    ReturnHandoffRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    HandoffToken:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: QRに埋め込む署名付きトークン
        expiresAt:
          type: string
          format: date-time
        jti:
          type: string
          description: 受け渡し用のトークンの ID。読み取られて記録されると、Handoff の jti と一致する（送る側が、読み取られたことを知るために使う）。返却用のトークンにはない

    ReceiveHandoffRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    Handoff:
      type: object
      required: [id, jti, from, to, item, qty, createdAt]
      properties:
        id:
          type: string
          format: uuid
        jti:
          type: string
          description: 記録に使った受け渡し用のトークンの ID
        from:
          $ref: "#/components/schemas/UserSummary"
        to:
          $ref: "#/components/schemas/UserSummary"
        item:
          type: string
        qty:
          type: integer
        createdAt:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date
          description: 返却期限。返却の必要がない受け渡しにはない
        returnRequestedAt:
          type: string
          format: date-time
          description: 対面でない返却を送った日時（貸した側の承認待ち）。送っていなければない
        returnedAt:
          type: string
          format: date-time
          description: 返却された日時。まだ返却されていなければない

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
