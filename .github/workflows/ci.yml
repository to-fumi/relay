name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: "0" # CI では Git フックを入れない

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      go: ${{ steps.filter.outputs.go }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - Taskfile.yml
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .github/workflows/ci.yml
            api:
              - *shared
              - api/**
              - redocly.yaml
              - web/openapi-ts.config.ts
              - web/src/shared/api/generated/**
              - backend-go/internal/api/**
            web:
              - *shared
              - web/**
            go:
              - *shared
              - backend-go/**
            devcontainer:
              - .devcontainer/**

  # openapi.yaml の検証と、生成コードが仕様と一致しているかの確認
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: |
            backend-go/go.sum
            backend-go/tools/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm task api:lint
      - run: pnpm task gen:check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm task web:check

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: |
            backend-go/go.sum
            backend-go/tools/go.sum
      - uses: arduino/setup-task@v3
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task go:check

  # 画面の E2E テスト。ビルドした SPA を API サーバーから配信して Playwright で操作し、スクショを撮る
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: |
            backend-go/go.sum
            backend-go/tools/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm task e2e:install
      - run: pnpm task e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # E2E のスクショを PR にコメントで載せる（スマホで PR を開くだけで見られるように）。
  # 画像は ci-screenshots ブランチの pr-<番号>/<コミット>/ に置き、同じコメントを更新し続ける
  screenshots:
    needs: e2e
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: shots
      - name: ci-screenshots ブランチに画像を置く
        if: steps.download.outcome == 'success'
        run: |
          short="${SHA::7}"
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin ci-screenshots; then
            git checkout -q -b ci-screenshots FETCH_HEAD
          else
            git checkout -q --orphan ci-screenshots
          fi
          rm -rf "pr-${PR}"
          mkdir -p "pr-${PR}/${short}"
          cp -r ../shots/. "pr-${PR}/${short}/"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "screenshots for #${PR} (${short})"
          git push -q origin ci-screenshots
      - name: PR にコメントする
        if: steps.download.outcome == 'success'
        run: |
          short="${SHA::7}"
          base="https://raw.githubusercontent.com/${REPO}/ci-screenshots/pr-${PR}/${short}"
          marker="<!-- e2e-screenshots -->"
          {
            echo "$marker"
            echo "**画面**（390×844、\`${short}\`）"
            echo
            echo "| | ライト | ダーク |"
            echo "|---|---|---|"
            for f in $(ls shots/light | sort); do
              name="${f%.png}"
              echo "| ${name#*-} | <img src=\"${base}/light/${f}\" width=\"150\"> | <img src=\"${base}/dark/${f}\" width=\"150\"> |"
            done
          } > comment.md
          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md > /dev/null
          fi

  # Dev Container を作り、その中で CI と同じチェックと E2E を通す（人・AI・CI が同じ環境で通ることを確かめる）
  devcontainer:
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: pnpm task check && pnpm task e2e

  # ブランチ保護の必須チェックにはこのジョブだけを指定する（スキップされたジョブは成功扱い）
  ci-ok:
    if: always()
    needs: [api, web, go, e2e, devcontainer]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
