# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: api
output: api.gen.go
generate:
  std-http-server: true
  strict-server: true
  models: true
output-options:
  skip-prune: true
  # /auth/* はリダイレクトと Cookie を扱うので、platform/auth で手で書く
  exclude-tags: [auth]
